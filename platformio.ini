; Perimeter Sensor V1 - RP2040-Zero sensor-fusion node
;   pio run                 build
;   pio run -t upload       flash (hold BOOT while plugging in if no UF2 drive appears)
;   pio device monitor      USB CLI (type 'help')

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
monitor_speed = 115200
build_flags =
    -Iinclude
    -Wall
    -Wno-unused-parameter
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
